name: Deploy — Standalone image for cloud hosting

on:
  workflow_dispatch:

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-standalone:
    name: Build standalone · Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push standalone image
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    services/api/Dockerfile
          target:  standalone
          push:    true
          tags:    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:standalone
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Verify image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:standalone
          docker run --rm \
            -e MODEL_PATH=/app/model/weights/model.pkl \
            -e MLFLOW_TRACKING_URI=file:./mlruns \
            -e MLFLOW_MODEL_NAME=pipeline-model \
            -e OTEL_EXPORTER_OTLP_ENDPOINT= \
            -e OTEL_SERVICE_NAME=pipeline-api \
            -p 8000:8000 \
            --detach --name standalone-test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:standalone
          for i in $(seq 1 12); do
            curl -sf http://localhost:8000/health > /dev/null 2>&1 && echo "OK after $((i*5))s" && break
            [ "$i" = "12" ] && docker logs standalone-test && exit 1
            sleep 5
          done
          curl -sf http://localhost:8000/health | python -m json.tool
          docker stop standalone-test
