name: CT — Continuous Training

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ct-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  MLFLOW_MODEL_NAME: pipeline-model
  MLFLOW_EXPERIMENT: pipeline-breast-cancer
  ENVIRONMENT: ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  train:
    name: Train · Validate · Promote
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      promoted:  ${{ steps.train.outputs.promoted }}
      tag:       ${{ steps.semver.outputs.tag }}
      version:   ${{ steps.train.outputs.version }}
      accuracy:  ${{ steps.train.outputs.accuracy }}
      f1:        ${{ steps.train.outputs.f1 }}
      precision: ${{ steps.train.outputs.precision }}
      recall:    ${{ steps.train.outputs.recall }}
      roc_auc:   ${{ steps.train.outputs.roc_auc }}

    env:
      MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI || 'file:./mlruns' }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME || '' }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install model dependencies
        run: pip install -r model/requirements.txt

      - name: Run training pipeline
        id: train
        working-directory: model
        run: |
          python train.py | tee /tmp/train_output.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
          output=$(cat /tmp/train_output.txt)
          version=$(echo "$output"  | grep '^version='  | head -1 | sed 's/^version=\([^ ]*\).*/\1/')
          promoted=$(echo "$output" | grep '^promoted=' | head -1 | sed 's/^promoted=\([^ ]*\).*/\1/')
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "promoted=$promoted" >> "$GITHUB_OUTPUT"
          for metric in accuracy f1 precision recall roc_auc; do
            val=$(echo "$output" | grep "^metric\.${metric}=" | head -1 | sed "s/^metric\.${metric}=//")
            echo "${metric}=${val}" >> "$GITHUB_OUTPUT"
          done

      - name: Compute next semantic tag
        id: semver
        run: |
          latest=$(git tag --sort=-version:refname | grep '^v[0-9]' | head -1)
          [ -z "$latest" ] && latest="v0.0.0"
          IFS='.' read -r major minor patch <<< "${latest#v}"
          echo "tag=v${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: |
            model/weights/model.pkl
            model/weights/metrics.json
          retention-days: 90

  deploy:
    name: Deploy
    needs: train
    if: needs.train.outputs.promoted == 'true'
    uses: ./.github/workflows/cd.yml
    with:
      tag: ${{ needs.train.outputs.tag }}
    secrets: inherit

  release:
    name: Tag · Release
    needs: [train, deploy]
    if: always() && needs.train.outputs.promoted == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create semantic tag
        run: |
          git tag "${{ needs.train.outputs.tag }}"
          git push origin "${{ needs.train.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Metrics"
            echo ""
            echo "| Metric    | Value |"
            echo "|-----------|-------|"
            echo "| Accuracy  | ${{ needs.train.outputs.accuracy }} |"
            echo "| F1        | ${{ needs.train.outputs.f1 }} |"
            echo "| Precision | ${{ needs.train.outputs.precision }} |"
            echo "| Recall    | ${{ needs.train.outputs.recall }} |"
            echo "| ROC-AUC   | ${{ needs.train.outputs.roc_auc }} |"
            echo ""
            echo "MLflow version: ${{ needs.train.outputs.version }}"
            echo "Commit: ${{ github.sha }}"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "${{ needs.train.outputs.tag }}" \
            --title "Model ${{ needs.train.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
