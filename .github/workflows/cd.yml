name: CD — Build and Publish

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build · Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag:    ${{ steps.meta.outputs.version }}
      image_ref:    ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag || github.event.release.tag_name }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    services/api/Dockerfile
          target:  runtime
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          build-args: |
            MLFLOW_MODEL_NAME=pipeline-model
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Smoke Test
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env for CI
        run: touch .env

      - name: Start ephemeral stack
        env:
          API_IMAGE: ${{ needs.build-push.outputs.image_ref }}
        run: |
          cat > docker-compose.ci.yml <<EOF
          services:
            api:
              image: ${API_IMAGE}
              build: !reset null
          EOF
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up --wait --wait-timeout 180 mlflow otel-collector api

      - name: Run smoke tests
        run: |
          curl -sf http://localhost:8000/health | python -m json.tool

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:8000/infer/ \
            -H "Content-Type: application/json" \
            -d '{"features":[17.99,10.38,122.8,1001.0,0.1184,0.2776,0.3001,0.1471,
                            0.2419,0.07871,1.095,0.9053,8.589,153.4,0.006399,0.04904,
                            0.05373,0.01587,0.03003,0.006193,25.38,17.33,184.6,2019.0,
                            0.1622,0.6656,0.7119,0.2654,0.4601,0.1189]}')
          [ "$STATUS" = "200" ] || (echo "Inference returned HTTP $STATUS" && exit 1)
          echo "Inference OK (HTTP 200)"

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
