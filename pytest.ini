[pytest]
testpaths = tests
addopts   = -v --tb=short
pythonpath = . services/api
filterwarnings =
    ignore::DeprecationWarning:pkg_resources:
    ignore::pydantic.warnings.PydanticDeprecatedSince20:
markers =
    fragile: tests that depend on internal Streamlit DOM structure and may break on Streamlit upgrades
