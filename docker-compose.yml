networks:
  pipeline_net:
    driver: bridge

volumes:
  model_weights:
  mlflow_data:     # MLflow backend-store (SQLite) + artifact-store

services:

  # ── MLflow Tracking Server (replaces MinIO + DVC artifact backend) ────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    container_name: pipeline_mlflow
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── OpenTelemetry Collector ─────────────────
  # Receives OTLP from the API; exports to any configured SaaS backend.
  # To add Datadog/CloudWatch exporters, extend otel-collector.yml and set
  # the corresponding API key secrets in .env.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: pipeline_otel_collector
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./monitoring/otel-collector/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "55679:55679" # zPages (debug UI)
    networks:
      - pipeline_net
    restart: unless-stopped

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
    container_name: pipeline_api
    env_file: .env
    environment:
      MODEL_PATH:                    /app/model/weights/model.pkl
      MLFLOW_TRACKING_URI:           http://mlflow:5000
      MLFLOW_MODEL_NAME:             pipeline-model
      OTEL_EXPORTER_OTLP_ENDPOINT:  http://otel-collector:4317
      OTEL_SERVICE_NAME:             pipeline-api
    volumes:
      - model_weights:/app/model/weights
    ports:
      - "8000:8000"
    networks:
      - pipeline_net
    depends_on:
      mlflow:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  seeder:
    build:
      context: ./services/seeder
    container_name: pipeline_seeder
    environment:
      API_URL:               http://api:8000
      REQUESTS_PER_SECOND:   "20"
      TRAINING_INTERVAL_S:   "30"
      TRAINING_BATCH_SIZE:   "50"
      DRIFT_ONSET_AFTER_S:   "120"
      DRIFT_MAGNITUDE:       "2.0"
      INFERENCE_CONCURRENCY: "10"
    networks:
      - pipeline_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
    container_name: pipeline_frontend
    environment:
      API_URL:     http://api:8000
      MLFLOW_URL:  http://localhost:5000
    ports:
      - "8501:8501"
    networks:
      - pipeline_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
