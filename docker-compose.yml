version: "3.9"

networks:
  pipeline_net:
    driver: bridge

volumes:
  model_weights:
  dvc_cache:
  prometheus_data:
  grafana_data:
  minio_data:

services:

  # ── MinIO (simulated S3 object storage for DVC artifacts) ────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: pipeline_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── One-shot container that creates the DVC bucket in MinIO ─────────────
  minio-init:
    image: minio/mc:latest
    container_name: pipeline_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/dvc-artifacts &&
        echo 'Bucket dvc-artifacts ready.'
      "
    networks:
      - pipeline_net
    restart: "no"

  # ── API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
    container_name: pipeline_api
    env_file: .env
    environment:
      MODEL_PATH:      /app/model/weights/model.pkl
      GIT_REPO_PATH:   /app
      DVC_REMOTE_PATH: /app/dvc-remote
      # MinIO credentials for dvc pull --remote minio
      AWS_ACCESS_KEY_ID:     ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - model_weights:/app/model/weights
      - dvc_cache:/app/.dvc/cache
      - ./dvc-remote:/app/dvc-remote
      - ./.git:/app/.git:ro
    ports:
      - "8000:8000"
    networks:
      - pipeline_net
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  seeder:
    build:
      context: ./services/seeder
    container_name: pipeline_seeder
    environment:
      API_URL:                http://api:8000
      REQUESTS_PER_SECOND:    "20"
      TRAINING_INTERVAL_S:    "30"
      TRAINING_BATCH_SIZE:    "50"
      DRIFT_ONSET_AFTER_S:    "120"
      DRIFT_MAGNITUDE:        "2.0"
      INFERENCE_CONCURRENCY:  "10"
    networks:
      - pipeline_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
    container_name: pipeline_frontend
    environment:
      API_URL:     http://api:8000
      GRAFANA_URL: http://localhost:3000
    ports:
      - "8501:8501"
    networks:
      - pipeline_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pipeline_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - pipeline_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: pipeline_grafana
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/pipeline.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - pipeline_net
    depends_on:
      - prometheus
    restart: unless-stopped
