name: CT — Continuous Training

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ct-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  MLFLOW_MODEL_NAME: pipeline-model
  MLFLOW_EXPERIMENT: pipeline-breast-cancer
  ENVIRONMENT: ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: pwsh -NoProfile -NonInteractive {0}

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  train:
    name: Train · Validate · Promote
    needs: ci
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      promoted:  ${{ steps.train.outputs.promoted }}
      tag:       ${{ steps.semver.outputs.tag }}
      version:   ${{ steps.train.outputs.version }}
      accuracy:  ${{ steps.train.outputs.accuracy }}
      f1:        ${{ steps.train.outputs.f1 }}
      precision: ${{ steps.train.outputs.precision }}
      recall:    ${{ steps.train.outputs.recall }}
      roc_auc:   ${{ steps.train.outputs.roc_auc }}

    env:
      MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install model dependencies
        run: pip install -r model/requirements.txt

      - name: Run training pipeline
        id: train
        working-directory: model
        run: |
          python train.py | Tee-Object -Variable output
          $version  = ($output | Where-Object { $_ -match '^version='  } | Select-Object -First 1) -replace '^version=(\S+).*',  '$1'
          $promoted = ($output | Where-Object { $_ -match '^promoted=' } | Select-Object -First 1) -replace '^promoted=(\S+).*', '$1'
          "version=$version"   >> $env:GITHUB_OUTPUT
          "promoted=$promoted" >> $env:GITHUB_OUTPUT
          foreach ($metric in @('accuracy','f1','precision','recall','roc_auc')) {
            $val = ($output | Where-Object { $_ -match "^metric\.$metric=" } | Select-Object -First 1) -replace "^metric\.$metric=(.*)", '$1'
            "$metric=$val" >> $env:GITHUB_OUTPUT
          }

      - name: Compute next semantic tag
        id: semver
        run: |
          $latest = git tag --sort=-version:refname | Where-Object { $_ -match '^v\d' } | Select-Object -First 1
          if (-not $latest) { $latest = "v0.0.0" }
          $parts = $latest.TrimStart('v').Split('.')
          $major = $parts[0]; $minor = $parts[1]; $patch = [int]$parts[2]
          "tag=v${major}.${minor}.$($patch + 1)" >> $env:GITHUB_OUTPUT

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: |
            model/weights/model.pkl
            model/metrics.json
          retention-days: 90

  deploy:
    name: Deploy
    needs: train
    if: needs.train.outputs.promoted == 'true'
    uses: ./.github/workflows/cd.yml
    with:
      tag: ${{ needs.train.outputs.tag }}
    secrets: inherit

  release:
    name: Tag · Release
    needs: [train, deploy]
    if: always() && needs.train.outputs.promoted == 'true' && needs.deploy.result == 'success'
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create semantic tag
        run: |
          git tag "${{ needs.train.outputs.tag }}"
          git push origin "${{ needs.train.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notesFile = "$env:RUNNER_TEMP\release-notes.md"
          @(
            "## Metrics",
            "",
            "| Metric    | Value |",
            "|-----------|-------|",
            "| Accuracy  | ${{ needs.train.outputs.accuracy }} |",
            "| F1        | ${{ needs.train.outputs.f1 }} |",
            "| Precision | ${{ needs.train.outputs.precision }} |",
            "| Recall    | ${{ needs.train.outputs.recall }} |",
            "| ROC-AUC   | ${{ needs.train.outputs.roc_auc }} |",
            "",
            "MLflow version: ${{ needs.train.outputs.version }}",
            "Commit: ${{ github.sha }}"
          ) | Set-Content $notesFile -Encoding UTF8
          gh release create "${{ needs.train.outputs.tag }}" --title "Model ${{ needs.train.outputs.tag }}" --notes-file $notesFile
