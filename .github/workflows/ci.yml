name: CI para Pipeline en GitHub Actions

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.11"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolución de dependencias aprovechando la caché nativa de GitHub Actions
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r services/api/requirements.txt
          pip install -r tests/requirements.txt

      # Ejecución de aserciones lógicas aislando la capa de infraestructura (TestAPIEndpoints)
      - name: Run unit tests
        run: pytest tests/ -k "not TestAPIEndpoints" -v --tb=short
