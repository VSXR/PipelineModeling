name: Build & Deploy

on:
  push:
    tags:
      - "v*"          # triggered by retrain.yml tags on main
  workflow_dispatch:  # manual trigger for hotfixes

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ── 1. Build & push container image ─────────────────────────────────────────
  build-push:
    name: Build · Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag:    ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       services/api/Dockerfile
          target:     runtime
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            IMAGE_TAG=${{ steps.meta.outputs.version }}

  # ── 2. Smoke-test the published image ────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start stack
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image_tag }}
        run: |
          # Override the api build with the published image
          cat > docker-compose.ci.yml <<EOF
          services:
            api:
              image: ${API_IMAGE}
              build: !reset null
          EOF
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d mlflow otel-collector api

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && echo "API ready" && exit 0
            echo "Attempt $i/30 — waiting…"
            sleep 3
          done
          echo "API did not become ready" && exit 1

      - name: Run smoke tests
        run: |
          # Health check
          curl -sf http://localhost:8000/health | python -m json.tool

          # Inference with a known malignant sample (label 0)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:8000/infer/ \
            -H "Content-Type: application/json" \
            -d '{"features":[17.99,10.38,122.8,1001.0,0.1184,0.2776,0.3001,0.1471,
                            0.2419,0.07871,1.095,0.9053,8.589,153.4,0.006399,0.04904,
                            0.05373,0.01587,0.03003,0.006193,25.38,17.33,184.6,2019.0,
                            0.1622,0.6656,0.7119,0.2654,0.4601,0.1189]}')
          [ "$STATUS" = "200" ] || (echo "Inference returned HTTP $STATUS" && exit 1)
          echo "Inference OK (HTTP 200)"

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ── 3. Optional: deploy to target environment ─────────────────────────────────
  # Uncomment and adapt for your deployment target (k8s rollout, ECS, Cloud Run…)
  #
  # deploy-production:
  #   name: Deploy to Production
  #   needs: [build-push, smoke-test]
  #   runs-on: ubuntu-latest
  #   environment: production
  #   steps:
  #     - name: Rollout
  #       run: |
  #         # Example: kubectl set image deployment/pipeline-api \
  #         #   api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.image_digest }}
  #         echo "Deploy image digest: ${{ needs.build-push.outputs.image_digest }}"
