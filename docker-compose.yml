networks:
  pipeline_net:
    driver: bridge

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    container_name: pipeline_mlflow
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --artifacts-destination /mlflow/artifacts
        --serve-artifacts
        --host 0.0.0.0
        --port 5000
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:5000/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: pipeline_otel_collector
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./monitoring/otel-collector/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "55679:55679"
      - "9464:9464"
    networks:
      - pipeline_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: pipeline_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - pipeline_net
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pipeline_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - pipeline_net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
    container_name: pipeline_api
    env_file: .env
    environment:
      MODEL_PATH:                    /app/model/weights/model.pkl
      MLFLOW_TRACKING_URI:           http://mlflow:5000
      MLFLOW_MODEL_NAME:             pipeline-model
      OTEL_EXPORTER_OTLP_ENDPOINT:   http://otel-collector:4317
      OTEL_SERVICE_NAME:             pipeline-api
      ENABLE_DEBUG_ENDPOINTS:        ${ENABLE_DEBUG_ENDPOINTS:-false}
    volumes:
      - ./model/weights:/app/model/weights
    ports:
      - "8000:8000"
    networks:
      - pipeline_net
    depends_on:
      mlflow:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./services
      dockerfile: frontend/Dockerfile
    container_name: pipeline_frontend
    environment:
      API_URL:        http://api:8000
      MLFLOW_URL:     http://mlflow:5000
      GRAFANA_URL:    http://grafana:3000
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8501:8501"
    networks:
      - pipeline_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  seeder:
    build:
      context: ./services/seeder
    container_name: pipeline_seeder
    environment:
      API_URL:               http://api:8000
      REQUESTS_PER_SECOND:   "20"
      TRAINING_INTERVAL_S:   "30"
      TRAINING_BATCH_SIZE:   "50"
      DRIFT_ONSET_AFTER_S:   "120"
      DRIFT_MAGNITUDE:       "2.0"
      INFERENCE_CONCURRENCY: "10"
    networks:
      - pipeline_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
