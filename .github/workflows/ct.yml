name: CT — Continuous Training

on:
  push:
    branches: [master]
    paths:
      - "model/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  MLFLOW_MODEL_NAME: pipeline-model
  MLFLOW_EXPERIMENT: pipeline-breast-cancer
  ENVIRONMENT: ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: pwsh -NoProfile -NonInteractive {0}

jobs:
  train:
    name: Train · Validate · Promote · Release
    runs-on: self-hosted

    env:
      MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install model dependencies
        run: pip install -r model/requirements.txt

      - name: Run training pipeline
        id: train
        working-directory: model
        run: |
          python train.py | Tee-Object -Variable output
          $version  = ($output | Where-Object { $_ -match '^version='  } | Select-Object -First 1) -replace '^version=(\S+).*',  '$1'
          $promoted = ($output | Where-Object { $_ -match '^promoted=' } | Select-Object -First 1) -replace '^promoted=(\S+).*', '$1'
          "version=$version"   >> $env:GITHUB_OUTPUT
          "promoted=$promoted" >> $env:GITHUB_OUTPUT
          foreach ($metric in @('accuracy','f1','precision','recall','roc_auc')) {
            $val = ($output | Where-Object { $_ -match "^metric\.$metric=" } | Select-Object -First 1) -replace "^metric\.$metric=(.*)", '$1'
            "$metric=$val" >> $env:GITHUB_OUTPUT
          }

      - name: Compute next semantic tag
        id: semver
        run: |
          $latest = git tag --sort=-version:refname | Where-Object { $_ -match '^v\d' } | Select-Object -First 1
          if (-not $latest) { $latest = "v0.0.0" }
          $parts = $latest.TrimStart('v').Split('.')
          $major = $parts[0]; $minor = $parts[1]; $patch = [int]$parts[2]
          "tag=v${major}.${minor}.$($patch + 1)" >> $env:GITHUB_OUTPUT

      - name: Configure git identity
        if: steps.train.outputs.promoted == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create semantic tag
        if: steps.train.outputs.promoted == 'true'
        run: |
          git tag "${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.train.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notesFile = "$env:RUNNER_TEMP\release-notes.md"
          @(
            "## Metrics",
            "",
            "| Metric    | Value |",
            "|-----------|-------|",
            "| Accuracy  | ${{ steps.train.outputs.accuracy }} |",
            "| F1        | ${{ steps.train.outputs.f1 }} |",
            "| Precision | ${{ steps.train.outputs.precision }} |",
            "| Recall    | ${{ steps.train.outputs.recall }} |",
            "| ROC-AUC   | ${{ steps.train.outputs.roc_auc }} |",
            "",
            "MLflow version: ${{ steps.train.outputs.version }}",
            "Commit: ${{ github.sha }}"
          ) | Set-Content $notesFile -Encoding UTF8
          gh release create "${{ steps.semver.outputs.tag }}" --title "Model ${{ steps.semver.outputs.tag }}" --notes-file $notesFile

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: |
            model/weights/model.pkl
            model/metrics.json
          retention-days: 90
